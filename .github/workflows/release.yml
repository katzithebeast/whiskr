# Builds the Windows installer and publishes it as a GitHub Release.
# Runs when a commit on main carries a NEW version in src-tauri/Cargo.toml
# (a release v<version> doesn't exist yet) — or by hand: Actions → Release → Run workflow.
#
# The repo is public, so the in-app updater reads releases without any token.
# (If it ever goes private: add a read-only token as the WHISKR_UPDATE_TOKEN
# secret — it gets baked into the app.)
name: Release

on:
  push:
    branches: [main]
    paths: ["src-tauri/Cargo.toml", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version from Cargo.toml
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "v=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release v$v already exists — nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.ver.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        if: steps.ver.outputs.skip != 'true'

      - uses: swatinem/rust-cache@v2
        if: steps.ver.outputs.skip != 'true'
        with:
          workspaces: src-tauri

      - run: npm ci
        if: steps.ver.outputs.skip != 'true'

      - name: Build
        if: steps.ver.outputs.skip != 'true'
        shell: bash
        env:
          WHISKR_UPDATE_TOKEN: ${{ secrets.WHISKR_UPDATE_TOKEN }}
          WHISKR_REPO: ${{ github.repository }}
        run: |
          cargo build --release --manifest-path src-tauri/Cargo.toml --bin whiskr-mcp
          npx tauri build --bundles nsis --config '{"bundle":{"resources":{"target/release/whiskr-mcp.exe":"whiskr-mcp.exe"}}}'
          ls -la src-tauri/target/release/bundle/nsis

      - name: Publish release
        if: steps.ver.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: Whiskr ${{ steps.ver.outputs.v }}
          generate_release_notes: true
          files: src-tauri/target/release/bundle/nsis/*-setup.exe
